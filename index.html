<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEOW-KNIGHT: Echoes of Infinity</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #050510; font-family: monospace; touch-action: none; }
        #game { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; color: #fff; font-weight: bold; }
        .box { background: rgba(0,0,0,0.7); border: 2px solid #fff; padding: 5px 10px; }
        #controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; }
        #dpad { width: 120px; height: 120px; position: relative; pointer-events: auto; }
        .btn { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 5px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; }
        #up { top: 0; left: 40px; } #down { bottom: 0; left: 40px; } #left { top: 40px; left: 0; } #right { top: 40px; right: 0; }
        #action { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,0,0,0.4); border: 3px solid #f00; color: white; font-weight: bold; pointer-events: auto; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050510; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; pointer-events: auto; }
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; background: #000; color: #0ff; border: 3px solid #0ff; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui">
        <div class="box">FISH: <span id="fish">0</span> | LVL: <span id="lvl">1</span></div>
        <div class="box" id="zone">MEADOW</div>
    </div>
    <div id="controls">
        <div id="dpad">
            <div class="btn" id="up">▲</div><div class="btn" id="down">▼</div>
            <div class="btn" id="left">◀</div><div class="btn" id="right">▶</div>
        </div>
        <div id="action">CLAW</div>
    </div>
    <div id="menu">
        <h1 style="color:#0ff; font-size:32px; text-align:center;">MEOW-KNIGHT</h1>
        <button id="start">START</button>
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

// --- IMAGE LOADING ---
// Change these names if your images are named differently!
const catImg = new Image();
catImg.src = 'cat_idle.png';
let catLoaded = false;
catImg.onload = () => { catLoaded = true; console.log("Cat image loaded!"); };
catImg.onerror = () => { console.log("Could not find cat_idle.png. Using fallback square."); };

// --- GAME STATE ---
let isPlaying = false;
let player = { x: W/2, y: H/2, size: 48, speed: 4, dir: 'down' };
let keys = { up: false, down: false, left: false, right: false };
let mobileDir = null;
let camera = { x: 0, y: 0 };
let fish = 0;
let level = 1;

// --- CONTROLS ---
window.addEventListener('keydown', e => {
    if(e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
    if(e.key === 's' || e.key === 'ArrowDown') keys.down = true;
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
});
window.addEventListener('keyup', e => {
    if(e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
    if(e.key === 's' || e.key === 'ArrowDown') keys.down = false;
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
});

function bindBtn(id, dir) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); mobileDir = dir; }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); mobileDir = null; }, {passive:false});
}
bindBtn('up', 'up'); bindBtn('down', 'down'); bindBtn('left', 'left'); bindBtn('right', 'right');

document.getElementById('action').addEventListener('touchstart', e => { e.preventDefault(); attack(); }, {passive:false});
window.addEventListener('keydown', e => { if(e.code === 'Space') attack(); });

document.getElementById('start').addEventListener('click', () => {
    document.getElementById('menu').style.display = 'none';
    isPlaying = true;
});

// --- GAME LOGIC ---
function attack() {
    if(!isPlaying) return;
    // Simple visual attack (flash red)
    ctx.fillStyle = 'rgba(255,0,0,0.3)';
    ctx.fillRect(0,0,W,H);
}

function update() {
    if(!isPlaying) return;

    let dx = 0, dy = 0;
    if(keys.up || mobileDir === 'up') { dy = -1; player.dir = 'up'; }
    if(keys.down || mobileDir === 'down') { dy = 1; player.dir = 'down'; }
    if(keys.left || mobileDir === 'left') { dx = -1; player.dir = 'left'; }
    if(keys.right || mobileDir === 'right') { dx = 1; player.dir = 'right'; }

    if(dx !== 0 || dy !== 0) {
        player.x += dx * player.speed;
        player.y += dy * player.speed;
    }

    // Camera follows player
    camera.x = player.x - W/2;
    camera.y = player.y - H/2;

    // Update UI
    document.getElementById('fish').innerText = fish;
    document.getElementById('lvl').innerText = level;
}

function draw() {
    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0,0,W,H);

    // Draw Grid (so you can tell you are moving)
    ctx.strokeStyle = '#2d2d4e';
    ctx.lineWidth = 2;
    let offsetX = camera.x % 64;
    let offsetY = camera.y % 64;
    for(let x = -offsetX; x < W; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for(let y = -offsetY; y < H; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Draw Player
    let screenX = player.x - camera.x;
    let screenY = player.y - camera.y;

    if(catLoaded) {
        ctx.drawImage(catImg, screenX - player.size/2, screenY - player.size/2, player.size, player.size);
    } else {
        // Fallback Blue Square if image fails
        ctx.fillStyle = '#0ff';
        ctx.fillRect(screenX - player.size/2, screenY - player.size/2, player.size, player.size);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
