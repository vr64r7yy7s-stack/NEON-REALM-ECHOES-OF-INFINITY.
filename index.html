<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEOW-KNIGHT: Echoes of Infinity</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #050510; font-family: monospace; touch-action: none; }
        #game { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; color: #fff; font-weight: bold; }
        .box { background: rgba(0,0,0,0.7); border: 2px solid #fff; padding: 5px 10px; }
        
        #hp-container { width: 100px; height: 15px; background: #333; border: 2px solid #fff; margin-top: 5px; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.2s; }

        #controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
        #dpad { width: 120px; height: 120px; position: relative; pointer-events: auto; }
        .btn { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 5px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; }
        #up { top: 0; left: 40px; } #down { bottom: 0; left: 40px; } #left { top: 40px; left: 0; } #right { top: 40px; right: 0; }
        
        .action-btns { display: flex; gap: 15px; pointer-events: auto; margin-bottom: 10px; }
        .action-circle { width: 70px; height: 70px; border-radius: 50%; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 14px;}
        #jumpBtn { background: rgba(0, 255, 0, 0.4); border: 3px solid #0f0; }
        #attackBtn { background: rgba(255, 0, 0, 0.4); border: 3px solid #f00; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050510; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; pointer-events: auto; }
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; background: #000; color: #0ff; border: 3px solid #0ff; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    
    <div id="ui">
        <div class="box">
            <div>LVL: <span id="lvl">1</span> | FISH: <span id="fish">0</span></div>
            <div id="hp-container"><div id="hp-bar"></div></div>
        </div>
        <div class="box" id="zone">MEADOW</div>
    </div>

    <div id="controls">
        <div id="dpad">
            <div class="btn" id="up">▲</div><div class="btn" id="down">▼</div>
            <div class="btn" id="left">◀</div><div class="btn" id="right">▶</div>
        </div>
        <div class="action-btns">
            <div class="action-circle" id="jumpBtn">JUMP</div>
            <div class="action-circle" id="attackBtn">CLAW</div>
        </div>
    </div>

    <div id="menu">
        <h1 style="color:#0ff; font-size:32px; text-align:center;">MEOW-KNIGHT</h1>
        <button id="start">START</button>
    </div>

// --- GAME STATE ---
let isPlaying = false;
let isDead = false;
let player = { x: W/2, y: H/2, size: 64, speed: 4, dir: 'down', attackTimer: 0, hp: 100, invulnTimer: 0, jumpTimer: 0, isMoving: false };
let keys = { up: false, down: false, left: false, right: false };
let mobileDir = null;
let camera = { x: 0, y: 0 };
let fish = 0;
let level = 1;

// Dummy Enemy
let enemy = { x: W/2 + 300, y: H/2, size: 30, speed: 1.5, hitTimer: 0 };

// --- ROCKS (OBSTACLES) ---
let rocks = [
    { x: W/2 - 150, y: H/2 - 150, w: 80, h: 80 },
    { x: W/2 + 100, y: H/2 - 200, w: 100, h: 100 },
    { x: W/2 - 250, y: H/2 + 100, w: 120, h: 60 },
    { x: W/2 + 200, y: H/2 + 150, w: 60, h: 60 }
];

function checkRockCollision(x, y) {
    // If jumping, ignore rock collisions
    if (player.jumpTimer > 0) return false;
    
    const pW = 30; // Player collision box width
    const pH = 30; // Player collision box height
    for (let r of rocks) {
        if (x + pW/2 > r.x - r.w/2 &&
            x - pW/2 < r.x + r.w/2 &&
            y + pH/2 > r.y - r.h/2 &&
            y - pH/2 < r.y + r.h/2) {
            return true;
        }
    }
    return false;
}

window.addEventListener('keydown', e => {
    if(e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
    if(e.key === 's' || e.key === 'ArrowDown') keys.down = true;
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
    if(e.code === 'Space') attack();
    if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') jump();
});
window.addEventListener('keyup', e => {
    if(e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
    if(e.key === 's' || e.key === 'ArrowDown') keys.down = false;
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
});

function bindBtn(id, dir) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); mobileDir = dir; }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); mobileDir = null; }, {passive:false});
}
bindBtn('up', 'up'); bindBtn('down', 'down'); bindBtn('left', 'left'); bindBtn('right', 'right');

document.getElementById('jumpBtn').addEventListener('touchstart', e => { e.preventDefault(); jump(); }, {passive:false});
document.getElementById('attackBtn').addEventListener('touchstart', e => { e.preventDefault(); attack(); }, {passive:false});

document.getElementById('start').addEventListener('click', () => {
    document.getElementById('menu').style.display = 'none';
    isPlaying = true;
});

function jump() {
    if(!isPlaying || isDead || player.jumpTimer > 0) return;
    player.jumpTimer = 30; // Jump duration in frames (longer to clear rocks)
}

function attack() {
    if(!isPlaying || isDead || player.jumpTimer > 0) return;
    player.attackTimer = 20; 
    
    // Check if we hit the enemy
    let dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
    if (dist < 100 && enemy.hitTimer <= 0) {
        enemy.hitTimer = 60; // Enemy dies for 1 second
        fish += 10;
        document.getElementById('fish').innerText = fish;
    }
}

function update() {
    if(!isPlaying || isDead) return;
    
    if (player.attackTimer > 0) player.attackTimer--;
    if (player.invulnTimer > 0) player.invulnTimer--;
    if (player.jumpTimer > 0) player.jumpTimer--;

    let dx = 0, dy = 0;
    player.isMoving = false;
    
    if(keys.up || mobileDir === 'up') { dy = -1; player.dir = 'up'; player.isMoving = true; }
    if(keys.down || mobileDir === 'down') { dy = 1; player.dir = 'down'; player.isMoving = true; }
    if(keys.left || mobileDir === 'left') { dx = -1; player.dir = 'left'; player.isMoving = true; }
    if(keys.right || mobileDir === 'right') { dx = 1; player.dir = 'right'; player.isMoving = true; }

    // Move with Rock Collision Checks (Slide along walls)
    if(player.isMoving) {
        let nextX = player.x + (dx * player.speed);
        let nextY = player.y + (dy * player.speed);
        
        if (!checkRockCollision(nextX, player.y)) player.x = nextX;
        if (!checkRockCollision(player.x, nextY)) player.y = nextY;
    }

    camera.x = player.x - W/2;
    camera.y = player.y - H/2;

    // Enemy Logic
    if (enemy.hitTimer > 0) {
        enemy.hitTimer--;
        if (enemy.hitTimer <= 0) {
            enemy.x = player.x + (Math.random() > 0.5 ? 400 : -400);
            enemy.y = player.y + (Math.random() > 0.5 ? 400 : -400);
        }
    } else {
        let edx = player.x - enemy.x;
        let edy = player.y - enemy.y;
        let dist = Math.hypot(edx, edy);
        if (dist > 0) {
            enemy.x += (edx / dist) * enemy.speed;
            enemy.y += (edy / dist) * enemy.speed;
        }

        // Jumping makes you invincible
        if (dist < 50 && player.invulnTimer <= 0 && player.jumpTimer <= 0) {
            player.hp -= 20;
            player.invulnTimer = 60;
            document.getElementById('hp-bar').style.width = Math.max(0, player.hp) + '%';
            if (player.hp <= 0) {
                isDead = true;
            }
        }
    }

    document.getElementById('lvl').innerText = level;
}

function drawSprite(img, sx, sy, facingLeft, jumpOffset) {
    if (!img.complete) return;
    let scale = 1.5;
    let w = img.width * scale;
    let h = img.height * scale;
    
    // Draw Shadow
    if (jumpOffset > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(sx, sy, w/3, h/6, 0, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.save();
    if (facingLeft) {
        ctx.translate(sx, sy - jumpOffset);
        ctx.scale(-1, 1);
        ctx.drawImage(img, -w / 2, -h, w, h);
    } else {
        ctx.drawImage(img, sx - w / 2, sy - h - jumpOffset, w, h);
    }
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0,0,W,H);

    // Grid
    ctx.strokeStyle = '#2d2d4e';
    ctx.lineWidth = 2;
    let offsetX = camera.x % 64;
    let offsetY = camera.y % 64;
    for(let x = -offsetX; x < W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for(let y = -offsetY; y < H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Draw Rocks
    for (let r of rocks) {
        let rx = r.x - camera.x;
        let ry = r.y - camera.y;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(rx, ry + r.h/2 - 10, r.w/2, r.h/4, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Rock Body
        ctx.fillStyle = '#4a4a5a';
        ctx.beginPath();
        ctx.roundRect(rx - r.w/2, ry - r.h/2, r.w, r.h, 15);
        ctx.fill();
        
        // Rock Highlights
        ctx.fillStyle = '#6a6a7a';
        ctx.beginPath();
        ctx.roundRect(rx - r.w/2 + 10, ry - r.h/2 + 10, r.w/2 - 5, r.h/2 - 5, 10);
        ctx.fill();
    }

    let screenX = player.x - camera.x;
    let screenY = player.y - camera.y;

    // Draw Enemy
    if (enemy.hitTimer <= 0) {
        let ex = enemy.x - camera.x;
        let ey = enemy.y - camera.y;
        ctx.fillStyle = '#f00';
        ctx.fillRect(ex - enemy.size/2, ey - enemy.size/2, enemy.size, enemy.size);
        ctx.fillStyle = '#000';
        ctx.fillRect(ex - 8, ey - 5, 4, 4);
        ctx.fillRect(ex + 4, ey - 5, 4, 4);
    }

    // --- ANIMATION STATE MACHINE ---
    let currentImg = idleImg;
    let jumpOffset = 0;
    
    if (isDead) {
        currentImg = deathImg;
    } else if (player.attackTimer > 0) {
        currentImg = attackImg;
    } else if (player.jumpTimer > 0) {
        currentImg = jumpImg;
        // Calculate a smooth arc for the jump height
        let progress = (30 - player.jumpTimer) / 30;
        jumpOffset = Math.sin(progress * Math.PI) * 60; // Jump 60 pixels high
    } else if (player.invulnTimer > 0) {
        currentImg = damageImg; 
    } else if (player.isMoving) {
        currentImg = runImg; 
    }

    drawSprite(currentImg, screenX, screenY, player.dir === 'left', jumpOffset);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
